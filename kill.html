<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تطهير النظام</title>
</head>
<body>
    <h1>جاري تنظيف الكاش والسيرفيس وركر...</h1>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
                alert("✅ تم إبادة السيرفيس وركر بنجاح! يمكنك الآن العودة للموقع.");
            });
        }
    </script>
</body>
</html>
